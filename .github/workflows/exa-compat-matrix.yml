name: Exa Compatibility Matrix

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  exa-matrix:
    name: exa-py (${{ matrix.exa_spec }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - exa_spec: "exa-py==2.0.2"
            exa_label: "exa-py-2-0-2"
          - exa_spec: "exa-py==1.14.0"
            exa_label: "exa-py-1-14-0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools==82.0.1"
          pip install python-dotenv==1.0.1 nbformat==5.10.4 pytest==8.3.4 pydantic==2.11.7
          pip install "${{ matrix.exa_spec }}"
          pip install -e . --no-deps --no-build-isolation

      - name: Exa Compatibility Gate - full test suite
        shell: bash
        continue-on-error: true
        run: |
          python -m war_room.quality_gates run \
            --gate exa-compat-tests \
            --label "${{ matrix.exa_spec }}" \
            --output-dir runs/quality_gates \
            -- python -m pytest -q

      - name: Summarize Exa Compatibility Gate
        if: always()
        shell: bash
        run: |
          python -m war_room.quality_gates summarize \
            --output-dir runs/quality_gates \
            --summary-path runs/quality_gates/summary.md \
            --fail-on-failed

      - name: Upload Exa Compatibility Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-exa-${{ matrix.exa_label }}-${{ github.run_id }}
          path: runs/quality_gates/
          if-no-files-found: error
