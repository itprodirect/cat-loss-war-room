name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
      - codex/**
  pull_request:

jobs:
  test:
    name: Fresh Env Tests
    runs-on: ubuntu-latest
    outputs:
      verification_summary: ${{ steps.run_tests.outputs.verification_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=69"
          pip install -r requirements.txt
          pip install -e . --no-deps --no-build-isolation

      - name: Unit Test Gate - pytest
        id: run_tests
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m war_room.quality_gates run \
            --gate unit-tests \
            --output-dir runs/quality_gates \
            --github-output-key verification_summary \
            -- python -m pytest -q

      - name: Summarize Unit Test Gate
        if: always()
        shell: bash
        run: |
          python -m war_room.quality_gates summarize \
            --output-dir runs/quality_gates \
            --summary-path runs/quality_gates/summary.md \
            --fail-on-failed

      - name: Upload Unit Test Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-unit-${{ github.run_id }}
          path: runs/quality_gates/
          if-no-files-found: error

  fixture-smoke:
    name: Offline Fixture Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=69"
          pip install -r requirements.txt
          pip install -e . --no-deps --no-build-isolation

      - name: Offline Fixture Gate - committed fixture tests
        shell: bash
        continue-on-error: true
        run: |
          python -m war_room.quality_gates run \
            --gate offline-fixture-tests \
            --output-dir runs/quality_gates \
            -- python -m pytest -q tests/test_offline_demo_pack.py tests/test_intake_validation.py

      - name: Golden Snapshot Gate - snapshot tests
        shell: bash
        continue-on-error: true
        run: |
          python -m war_room.quality_gates run \
            --gate golden-snapshot-tests \
            --output-dir runs/quality_gates \
            -- python -m pytest -q tests/test_fixture_snapshots.py

      - name: Golden Snapshot Gate - committed snapshot diff
        shell: bash
        continue-on-error: true
        run: |
          python -m war_room.quality_gates run \
            --gate golden-snapshot-check \
            --output-dir runs/quality_gates \
            -- python -m war_room.fixture_snapshots --check

      - name: Summarize Fixture Quality Gates
        if: always()
        shell: bash
        run: |
          python -m war_room.quality_gates summarize \
            --output-dir runs/quality_gates \
            --summary-path runs/quality_gates/summary.md \
            --fail-on-failed

      - name: Upload Fixture Quality Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-fixtures-${{ github.run_id }}
          path: runs/quality_gates/
          if-no-files-found: error

  security-hygiene:
    name: Security Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=69"
          pip install -r requirements.txt
          pip install -e . --no-deps --no-build-isolation

      - name: Security Hygiene Gate - repo policy and artifact scan
        shell: bash
        continue-on-error: true
        run: |
          python -m war_room.quality_gates run \
            --gate security-hygiene-check \
            --output-dir runs/quality_gates \
            -- python -m war_room.security_hygiene --check

      - name: Summarize Security Hygiene Gate
        if: always()
        shell: bash
        run: |
          python -m war_room.quality_gates summarize \
            --output-dir runs/quality_gates \
            --summary-path runs/quality_gates/summary.md \
            --fail-on-failed

      - name: Upload Security Hygiene Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-security-${{ github.run_id }}
          path: runs/quality_gates/
          if-no-files-found: error

  dependency-hygiene:
    name: Dependency Hygiene
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency Hygiene Gate - dependency manifest scan
        shell: bash
        continue-on-error: true
        run: |
          python -m war_room.quality_gates run \
            --gate dependency-hygiene-check \
            --output-dir runs/quality_gates \
            -- python -m war_room.dependency_hygiene --check

      - name: Summarize Dependency Hygiene Gate
        if: always()
        shell: bash
        run: |
          python -m war_room.quality_gates summarize \
            --output-dir runs/quality_gates \
            --summary-path runs/quality_gates/summary.md \
            --fail-on-failed

      - name: Upload Dependency Hygiene Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-dependency-${{ github.run_id }}
          path: runs/quality_gates/
          if-no-files-found: error

  offline-e2e:
    name: Offline E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=69"
          pip install -r requirements.txt
          pip install -e . --no-deps --no-build-isolation


      - name: Prepare Offline E2E Artifact Directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runs/offline_e2e
          mkdir -p runs/offline_e2e

      - name: Offline E2E Gate - demo workflow artifacts
        shell: bash
        continue-on-error: true
        run: |
          python -m war_room.quality_gates run \
            --gate e2e-offline-demo \
            --output-dir runs/quality_gates \
            -- python -m war_room.offline_e2e --check

      - name: Summarize Offline E2E Gate
        if: always()
        shell: bash
        run: |
          python -m war_room.quality_gates summarize \
            --output-dir runs/quality_gates \
            --summary-path runs/quality_gates/summary.md \
            --fail-on-failed

      - name: Upload Offline E2E Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-e2e-offline-${{ github.run_id }}
          path: runs/quality_gates/
          if-no-files-found: error

      - name: Upload Offline E2E Demo Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-e2e-demo-${{ github.run_id }}
          path: |
            runs/offline_e2e/result.json
            runs/offline_e2e/result.md
          if-no-files-found: error

  release-scorecard:
    name: Release Scorecard Artifact
    runs-on: ubuntu-latest
    needs:
      - test
      - fixture-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=69"
          pip install -r requirements.txt
          pip install -e . --no-deps --no-build-isolation

      - name: Release Scorecard Gate - generate artifact
        shell: bash
        continue-on-error: true
        env:
          VERIFICATION_SUMMARY: ${{ needs.test.outputs.verification_summary }}
          CANDIDATE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m war_room.quality_gates run \
            --gate release-scorecard-generate \
            --output-dir runs/quality_gates \
            -- python -m war_room.release_scorecard \
              --candidate "$CANDIDATE" \
              --verification-summary "$VERIFICATION_SUMMARY"

      - name: Release Scorecard Gate - validate artifact
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m war_room.quality_gates run \
            --gate release-scorecard-validate \
            --output-dir runs/quality_gates \
            -- python -m war_room.release_scorecard \
              --validate-latest \
              --output-dir runs/release_scorecards

      - name: Summarize Release Scorecard Gates
        if: always()
        shell: bash
        run: |
          python -m war_room.quality_gates summarize \
            --output-dir runs/quality_gates \
            --summary-path runs/quality_gates/summary.md \
            --fail-on-failed

      - name: Upload Release Scorecard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-scorecard-${{ github.run_id }}
          path: runs/release_scorecards/
          if-no-files-found: error

      - name: Upload Release Scorecard Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-release-scorecard-${{ github.run_id }}
          path: runs/quality_gates/
          if-no-files-found: error
